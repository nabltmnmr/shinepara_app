name: shinepara_app
description: Shine AI-Powered E-commerce App - Arabic skincare products with AI recommendations
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'
  flutter: '>=3.16.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.0.3
  go_router: ^17.0.0
  dio: ^5.4.0
  dio_cookie_manager: ^3.1.1
  cookie_jar: ^4.0.8
  cached_network_image: ^3.3.1
  intl: 0.20.2
  flutter_svg: ^2.0.9
  carousel_slider: ^5.1.1
  url_launcher: ^6.2.2
  shared_preferences: ^2.2.2
  google_fonts: ^6.1.0
  flutter_secure_storage: ^9.0.0
  device_info_plus: ^10.1.0
  permission_handler: ^12.0.1
  image_picker: ^1.0.7
  camera: ^0.11.1
  google_mlkit_face_detection: ^0.12.0
  sensors_plus: ^6.1.1
  firebase_core: ^3.8.1
  firebase_messaging: ^15.1.6
  flutter_local_notifications: ^18.0.1
  video_player: ^2.8.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3
  flutter_native_splash: ^2.4.6

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/logo.png"
  adaptive_icon_background: "#0A1931"
  adaptive_icon_foreground: "assets/logo.png"
  min_sdk_android: 21

flutter_native_splash:
  color: "#0A1931"
  color_dark: "#0A1931"
  android_12:
    color: "#0A1931"
    icon_background_color: "#0A1931"

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/logo.png
    - assets/splash_video.mp4
